[package]
name = "utopia-audit"
description = "Audit trails: who did what to which resource, from where and when, stored in a utopia-database collection or a ClickHouse table, and read back by user, resource, event, time and custom queries."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/audit"

[features]
default = ["database", "clickhouse"]
# The Database adapter: logs as documents of a utopia-database collection.
database = ["dep:utopia-database"]
# The ClickHouse adapter: logs as rows of a MergeTree table, over ClickHouse's
# HTTP interface (utopia-client, with its multipart bodies).
clickhouse = ["dep:http", "dep:utopia-client", "dep:utopia-validators"]

[dependencies]
async-trait = "0.1"
http = { version = "1", optional = true }
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
thiserror = "2"
utopia-client = { version = "0.1.0", git = "https://github.com/utopia-rs/client", optional = true }
utopia-database = { version = "0.1.0", git = "https://github.com/utopia-rs/database", optional = true }
utopia-query = { version = "0.1.0", git = "https://github.com/utopia-rs/query" }
utopia-validators = { version = "0.1.0", git = "https://github.com/utopia-rs/validators", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "rt"] }
utopia-cache = { version = "0.1.0", git = "https://github.com/utopia-rs/cache" }
utopia-database = { version = "0.1.0", git = "https://github.com/utopia-rs/database", features = ["memory"] }

[package.metadata.utopia]
category = "observability"
php-sync = "da0119eda7c139b8f99b13d814e5a99f9b5ac418"